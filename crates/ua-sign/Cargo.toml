[package]
name = "ua-sign"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Key stores, certificates, signing in every format and level, verification and its reports.
ua-pki = { workspace = true, features = ["http"] }
# The curves of table Г.1 a new key is generated on.
ua-dstu4145.workspace = true
# The basis of a key's field, shown as PB or ONB.
ua-gf2m.workspace = true
# Serial numbers of certificates, time-stamps and OCSP responses, shown in hex.
num-bigint.workspace = true
# Validity periods, signing times and the report's times.
time.workspace = true
# The key store password typed at the terminal without echo.
rpassword.workspace = true

[dev-dependencies]
# Reads the synthetic hierarchy's keys recorded by tools/csharp-oracle (testdata/oracle/pki/hierarchy/keys.json).
serde_json.workspace = true
# The test PKI server reads requests and writes tokens and OCSP responses; the recipes read what ua-sign wrote.
ua-der.workspace = true
# Independent recipes: hashes by OID for the profile checks.
ua-gost.workspace = true
# Independent recipes: DSTU 7564 hashes for the profile checks.
ua-dstu7564.workspace = true
# The profile checks of XAdES: exclusive canonicalization of the signed elements.
ua-xml-c14n.workspace = true
# The profile checks of XAdES: the XML tree.
roxmltree.workspace = true
# The profile checks of XAdES: base64 values.
base64.workspace = true
# Reads and rewrites ASiC containers in the tests.
zip.workspace = true
