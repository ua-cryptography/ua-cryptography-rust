[package]
name = "ua-cryptography-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# A C ABI, not a Rust API: shipped as release archives, never to crates.io.
publish = false

[lib]
# ua_cryptography.dll / libua_cryptography.{so,dylib,a}; the rlib serves the tests.
name = "ua_cryptography"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Every operation behind the C ABI: bytes in, a model or a refusal out.
ua-cryptography-operations.workspace = true
# Signing levels and named files of the C ABI; the time-stamping, OCSP and caIssuers clients over sockets.
ua-cryptography-pki = { workspace = true, features = ["http"] }
# "Now" of a verification.
time.workspace = true

[dev-dependencies]
# Reads the JSON reports the C ABI returns.
serde_json.workspace = true
# The reference hash a C ABI hash is compared with.
ua-cryptography-gost.workspace = true
