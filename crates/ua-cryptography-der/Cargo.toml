[package]
name = "ua-cryptography-der"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A DER/BER reader that keeps the exact bytes of every element, a DER writer and PEM"
keywords = ["der", "ber", "asn1", "pem", "x509"]
categories = ["encoding", "parser-implementations", "cryptography"]
repository.workspace = true
# The tests read testdata/ of the workspace, which a package cannot carry: they run in the repository.
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
# INTEGER values and object identifier arcs of any size.
num-bigint.workspace = true
# UTCTime and GeneralizedTime as UTC date-times.
time.workspace = true
# The base64 body of PEM text.
base64.workspace = true

[dev-dependencies]
# Reads the oracle fixtures recorded by tools/csharp-oracle.
serde_json.workspace = true
