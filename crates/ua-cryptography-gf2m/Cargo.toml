[package]
name = "ua-cryptography-gf2m"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GF(2^m) in the polynomial and the optimal normal basis, and binary elliptic curves, as in DSTU 4145-2002"
keywords = ["gf2m", "binary-field", "elliptic-curve", "dstu4145", "ukraine"]
categories = ["cryptography", "mathematics"]
repository.workspace = true
# The tests read testdata/ of the workspace, which a package cannot carry: they run in the repository.
include = ["src/**", "README.md", "LICENSE"]

[features]
# Forces the portable carry-less multiplication (benchmarks of the fallback path, CPUs without PMULL/PCLMULQDQ).
portable = []

[dependencies]
# The standard representation of elements, scalars and orders are integers of up to 512 bits.
num-bigint.workspace = true
# `Zero` / `One` of the integers above.
num-traits.workspace = true
# Random elements and points, Miller–Rabin bases.
rand_core.workspace = true
