# The C header of the library: `cbindgen --config cbindgen.toml --output include/ua_cryptography.h` in this
# directory (build_scripts/ffi-header.sh); CI checks that the committed header is current.
language = "C"
header = """/*
 * ua_cryptography: GOST 28147-89, GOST 34.311-95, DSTU 7564, DSTU 7624, DSTU 4145-2002, and the signature formats
 * of the Ukrainian PKI (JKS, CAdES, XAdES, ASiC) behind a C ABI. Generated by cbindgen from crates/ua-ffi; do not
 * edit by hand.
 *
 * Every function returns a UaStatus. Inputs are lent for the call (UaBytes, NUL-terminated UTF-8 strings);
 * outputs are UaBuffer values the caller releases with ua_free_buffer, written only on UA_STATUS_OK. On any other
 * status, error_message (when not NULL) receives the refusal in UTF-8, also released with ua_free_buffer.
 */"""
include_guard = "UA_CRYPTOGRAPHY_H"
cpp_compat = true
documentation_style = "c99"
usize_is_size_t = true
style = "type"

[export]
include = ["UaCurveBasis", "UaSignatureFormat", "UaSignatureLevel", "UaSignatureHash"]

[enum]
rename_variants = "QualifiedScreamingSnakeCase"

[const]
allow_static_const = false

[struct]
associated_constants_in_body = false

