[package]
name = "ua-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# ua_cryptography.dll / libua_cryptography.{so,dylib,a}; the rlib serves the tests.
name = "ua_cryptography"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# GOST 28147-89 and GOST 34.311-95.
ua-gost.workspace = true
# DSTU 7564 (Kupyna).
ua-dstu7564.workspace = true
# DSTU 7624 (Kalyna) and its modes.
ua-dstu7624.workspace = true
# DSTU 4145: curves, keys, signing, verification, the generator of Appendix А.
ua-dstu4145.workspace = true
# Point compression and decompression of public keys.
ua-gf2m.workspace = true
# Key stores, certificates, signing in every format and verification.
ua-pki.workspace = true
# Private keys, e, r and s as big-endian integers.
num-bigint.workspace = true
# The bytes of the Appendix А generator.
rand_core.workspace = true
# The JSON of key store entries, certificate details and verification reports.
serde.workspace = true
serde_json.workspace = true
# Times in those reports, and certificate validity.
time.workspace = true

# Native platforms have sockets: the time-stamping, OCSP and caIssuers clients of ua-pki.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ua-pki = { workspace = true, features = ["http"] }

# The browser build: JavaScript bindings, and the browser's generator and clock for OsRng and "now".
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
getrandom = { workspace = true, features = ["js"] }
time = { workspace = true, features = ["wasm-bindgen"] }
