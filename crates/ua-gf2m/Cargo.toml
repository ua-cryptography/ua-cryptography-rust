[package]
name = "ua-gf2m"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Forces the portable carry-less multiplication (benchmarks of the fallback path, CPUs without PMULL/PCLMULQDQ).
portable = []

[dependencies]
# The standard representation of elements, scalars and orders are integers of up to 512 bits.
num-bigint.workspace = true
# `Zero` / `One` of the integers above.
num-traits.workspace = true
# Random elements and points, Miller–Rabin bases.
rand_core.workspace = true
