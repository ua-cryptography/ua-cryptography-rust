[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ua-cryptography/ua-cryptography-rust"

[workspace.dependencies]
# The crates of this workspace. crates.io needs the version beside the path; it stays equal to the workspace version
# (build_scripts/check-crate-versions.sh, run by CI).
ua-cryptography-gf2m = { path = "crates/ua-cryptography-gf2m", version = "0.2.0" }
ua-cryptography-gost = { path = "crates/ua-cryptography-gost", version = "0.2.0" }
ua-cryptography-dstu4145 = { path = "crates/ua-cryptography-dstu4145", version = "0.2.0" }
ua-cryptography-dstu-sboxes = { path = "crates/ua-cryptography-dstu-sboxes", version = "0.2.0" }
ua-cryptography-dstu7564 = { path = "crates/ua-cryptography-dstu7564", version = "0.2.0" }
ua-cryptography-dstu7624 = { path = "crates/ua-cryptography-dstu7624", version = "0.2.0" }
ua-cryptography-der = { path = "crates/ua-cryptography-der", version = "0.2.0" }
ua-cryptography-xml-c14n = { path = "crates/ua-cryptography-xml-c14n", version = "0.2.0" }
# Without its HTTP clients unless a crate asks for feature `http` (they do not build for wasm32-unknown-unknown).
ua-cryptography-pki = { path = "crates/ua-cryptography-pki", version = "0.2.0", default-features = false }
# The layer under the C ABI and the JavaScript bindings; never published.
ua-cryptography-operations = { path = "crates/ua-cryptography-operations", version = "0.2.0" }

# Third-party crates; each crate that uses one says why in its own Cargo.toml.
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
roxmltree = "0.21"
zip = { version = "9", default-features = false, features = ["deflate"] }
ureq = "2"
rpassword = "7"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
getrandom = "0.2"

# Field and curve arithmetic dominates the test suite; unoptimized it is two orders of magnitude slower.
[profile.test]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
