name: Release

# On a version tag (v1.2.3, v1.2.3-beta.1): the tests, then the ua_cryptography library (crates/ua-cryptography-ffi) for
# every platform, then a GitHub release with one archive per platform, the bare shared libraries and SHA256SUMS, then
# the npm package ua-cryptography once the author approves the `npm` environment and the crates on crates.io once the
# author approves the `crates-io` environment.
#
# Bare shared libraries, one architecture each, for build hooks that download a single file (the Dart package):
# ua-cryptography-<version>-<os>-<arch>.<so|dylib|dll>, os in android, ios, ios-simulator, macos, linux, windows,
# arch in arm64, arm, x64, ia32. Single-architecture because Flutter runs a hook per architecture and merges with lipo.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag names the crate's version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "ua-cryptography-ffi") | .version')"
          if [[ "$version" != "$crate_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME, but the workspace version is $crate_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: [test, version]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            platform: windows-x64
            is_native: true
          # Cross-compiled: the smoke test cannot run on the x64 runner. ring needs the runner's clang here.
          - target: aarch64-pc-windows-msvc
            platform: windows-arm64
            is_native: false
    env:
      PACKAGE: ua-cryptography-${{ needs.version.outputs.version }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p ua-cryptography-ffi --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          built="target/${{ matrix.target }}/release"
          mkdir -p "$PACKAGE/include" "$PACKAGE/lib"
          cp crates/ua-cryptography-ffi/include/ua_cryptography.h "$PACKAGE/include/"
          cp "$built/ua_cryptography.dll" "$built/ua_cryptography.dll.lib" "$built/ua_cryptography.lib" \
            "$built/ua_cryptography.pdb" "$PACKAGE/lib/"
          build_scripts/ffi-static-libs.sh "${{ matrix.target }}" "$PACKAGE/lib/native-static-libs.txt"
          cp LICENSE THIRD-PARTY-NOTICES.md crates/ua-cryptography-ffi/README.md "$PACKAGE/"

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.is_native

      - name: Smoke test
        if: matrix.is_native
        shell: cmd
        run: |
          cl /nologo /std:c11 /I %PACKAGE%\include crates\ua-cryptography-ffi\tests\c\smoke_test.c %PACKAGE%\lib\ua_cryptography.dll.lib /Fe:smoke_test.exe
          copy %PACKAGE%\lib\ua_cryptography.dll .
          smoke_test.exe

      - name: Archive
        shell: pwsh
        run: |
          Compress-Archive -Path $env:PACKAGE -DestinationPath "$env:PACKAGE.zip"
          Copy-Item "$env:PACKAGE\lib\ua_cryptography.dll" "$env:PACKAGE.dll"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            ${{ env.PACKAGE }}.zip
            ${{ env.PACKAGE }}.dll
          if-no-files-found: error

  macos:
    needs: [test, version]
    runs-on: macos-latest
    env:
      PACKAGE: ua-cryptography-${{ needs.version.outputs.version }}-macos-universal
      BARE: ua-cryptography-${{ needs.version.outputs.version }}-macos
      # ring compiles C: without it, it targets the SDK the runner happens to have. Only this one here:
      # with IPHONEOS_DEPLOYMENT_TARGET also set, a bare cc (the smoke test) targets iOS.
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      # cargo's strip of the dylib breaks the linker of newer Xcode releases ("mis-aligned LINKEDIT string pool").
      CARGO_PROFILE_RELEASE_STRIP: none
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          cargo build --release --locked -p ua-cryptography-ffi --target aarch64-apple-darwin
          cargo build --release --locked -p ua-cryptography-ffi --target x86_64-apple-darwin

      - name: Package
        run: |
          mkdir -p "$PACKAGE/include" "$PACKAGE/lib"
          cp crates/ua-cryptography-ffi/include/ua_cryptography.h crates/ua-cryptography-ffi/include/module.modulemap \
            "$PACKAGE/include/"
          for kind in a dylib; do
            lipo -create -output "$PACKAGE/lib/libua_cryptography.$kind" \
              "target/aarch64-apple-darwin/release/libua_cryptography.$kind" \
              "target/x86_64-apple-darwin/release/libua_cryptography.$kind"
          done
          # rustc writes the build directory as the install name; the changed dylib needs a fresh ad-hoc signature.
          install_name_tool -id @rpath/libua_cryptography.dylib "$PACKAGE/lib/libua_cryptography.dylib"
          codesign --force --sign - "$PACKAGE/lib/libua_cryptography.dylib"
          lipo -info "$PACKAGE/lib/libua_cryptography.a" "$PACKAGE/lib/libua_cryptography.dylib"
          build_scripts/ffi-static-libs.sh aarch64-apple-darwin "$PACKAGE/lib/native-static-libs.txt"
          cp LICENSE THIRD-PARTY-NOTICES.md crates/ua-cryptography-ffi/README.md "$PACKAGE/"

      - name: Smoke test
        run: |
          cc -std=c11 -Wall -I "$PACKAGE/include" crates/ua-cryptography-ffi/tests/c/smoke_test.c \
            -L "$PACKAGE/lib" -lua_cryptography -Wl,-rpath,"$PWD/$PACKAGE/lib" -o smoke_test
          ./smoke_test
          # The x86_64 slice runs where the runner has Rosetta.
          if arch -x86_64 /usr/bin/true 2> /dev/null; then
            cc -std=c11 -arch x86_64 -I "$PACKAGE/include" crates/ua-cryptography-ffi/tests/c/smoke_test.c \
              -L "$PACKAGE/lib" -lua_cryptography -Wl,-rpath,"$PWD/$PACKAGE/lib" -o smoke_test_x86_64
            arch -x86_64 ./smoke_test_x86_64
          else
            echo "::notice::No Rosetta on the runner: the x86_64 slice is built but not run."
          fi

      # The slices of the signed universal dylib keep their signatures.
      - name: Archive
        run: |
          zip -r -y "$PACKAGE.zip" "$PACKAGE"
          lipo "$PACKAGE/lib/libua_cryptography.dylib" -thin arm64 -output "$BARE-arm64.dylib"
          lipo "$PACKAGE/lib/libua_cryptography.dylib" -thin x86_64 -output "$BARE-x64.dylib"
          codesign --verify "$BARE-arm64.dylib" "$BARE-x64.dylib"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            ${{ env.PACKAGE }}.zip
            ${{ env.BARE }}-*.dylib
          if-no-files-found: error

  linux:
    needs: [test, version]
    # The oldest supported image: the library runs on glibc 2.35 and newer.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            platform: linux-x64
            is_native: true
          # Cross-compiled with the distribution's GNU toolchain: the smoke test cannot run on the x64 runner.
          - target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            is_native: false
    env:
      PACKAGE: ua-cryptography-${{ needs.version.outputs.version }}-${{ matrix.platform }}
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Cross toolchain
        if: ${{ !matrix.is_native }}
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --locked -p ua-cryptography-ffi --target ${{ matrix.target }}

      - name: Package
        run: |
          built="target/${{ matrix.target }}/release"
          mkdir -p "$PACKAGE/include" "$PACKAGE/lib"
          cp crates/ua-cryptography-ffi/include/ua_cryptography.h "$PACKAGE/include/"
          cp "$built/libua_cryptography.so" "$built/libua_cryptography.a" "$PACKAGE/lib/"
          build_scripts/ffi-static-libs.sh "${{ matrix.target }}" "$PACKAGE/lib/native-static-libs.txt"
          cp LICENSE THIRD-PARTY-NOTICES.md crates/ua-cryptography-ffi/README.md "$PACKAGE/"

      - name: Smoke test
        if: matrix.is_native
        run: |
          cc -std=c11 -Wall -I "$PACKAGE/include" crates/ua-cryptography-ffi/tests/c/smoke_test.c \
            -L "$PACKAGE/lib" -lua_cryptography -Wl,-rpath,"$PWD/$PACKAGE/lib" -o smoke_test
          ./smoke_test

      - name: Archive
        run: |
          tar -czf "$PACKAGE.tar.gz" "$PACKAGE"
          cp "$PACKAGE/lib/libua_cryptography.so" "$PACKAGE.so"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            ${{ env.PACKAGE }}.tar.gz
            ${{ env.PACKAGE }}.so
          if-no-files-found: error

  android:
    needs: [test, version]
    runs-on: ubuntu-latest
    env:
      PACKAGE: ua-cryptography-${{ needs.version.outputs.version }}-android
      # 16 KB pages, which Android 15 devices may use and Google Play requires.
      RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # API level 21 (Android 5.0), the lowest the NDK still supports; the runner's latest NDK.
      - name: Build
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk --platform 21 --output-dir "$PACKAGE/jniLibs" \
            -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 \
            build --release --locked -p ua-cryptography-ffi

      - name: Package
        run: |
          mkdir -p "$PACKAGE/include"
          cp crates/ua-cryptography-ffi/include/ua_cryptography.h "$PACKAGE/include/"
          cp LICENSE THIRD-PARTY-NOTICES.md crates/ua-cryptography-ffi/README.md "$PACKAGE/"
          find "$PACKAGE/jniLibs" -name '*.so' | sort
          test "$(find "$PACKAGE/jniLibs" -name libua_cryptography.so | wc -l)" -eq 4

      - name: Archive
        run: |
          zip -r "$PACKAGE.zip" "$PACKAGE"
          cp "$PACKAGE/jniLibs/arm64-v8a/libua_cryptography.so" "$PACKAGE-arm64.so"
          cp "$PACKAGE/jniLibs/armeabi-v7a/libua_cryptography.so" "$PACKAGE-arm.so"
          cp "$PACKAGE/jniLibs/x86_64/libua_cryptography.so" "$PACKAGE-x64.so"
          cp "$PACKAGE/jniLibs/x86/libua_cryptography.so" "$PACKAGE-ia32.so"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            ${{ env.PACKAGE }}.zip
            ${{ env.PACKAGE }}-*.so
          if-no-files-found: error

  ios:
    needs: [test, version]
    runs-on: macos-latest
    env:
      PACKAGE: ua-cryptography-${{ needs.version.outputs.version }}-ios
      # ring compiles C: without it, it targets the SDK the runner happens to have.
      IPHONEOS_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          for target in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios; do
            cargo build --release --locked -p ua-cryptography-ffi --target "$target" --lib
          done

      # Static libraries: a device slice and one simulator slice for both architectures.
      - name: XCFramework
        run: |
          mkdir -p headers simulator "$PACKAGE"
          cp crates/ua-cryptography-ffi/include/ua_cryptography.h crates/ua-cryptography-ffi/include/module.modulemap \
            headers/
          lipo -create -output simulator/libua_cryptography.a \
            target/aarch64-apple-ios-sim/release/libua_cryptography.a \
            target/x86_64-apple-ios/release/libua_cryptography.a
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libua_cryptography.a -headers headers \
            -library simulator/libua_cryptography.a -headers headers \
            -output "$PACKAGE/UaCryptography.xcframework"
          build_scripts/ffi-static-libs.sh aarch64-apple-ios "$PACKAGE/native-static-libs.txt"
          cp LICENSE THIRD-PARTY-NOTICES.md crates/ua-cryptography-ffi/README.md "$PACKAGE/"

      # Dynamic libraries, one per architecture: Flutter loads only dynamic ones and wraps each into a framework.
      - name: Dynamic libraries
        run: |
          for slice in aarch64-apple-ios:arm64 aarch64-apple-ios-sim:simulator-arm64 x86_64-apple-ios:simulator-x64; do
            bare="$PACKAGE-${slice#*:}.dylib"
            cp "target/${slice%%:*}/release/libua_cryptography.dylib" "$bare"
            # rustc writes the build directory as the install name; the changed dylib needs a fresh ad-hoc signature.
            install_name_tool -id @rpath/libua_cryptography.dylib "$bare"
            codesign --force --sign - "$bare"
            lipo -info "$bare"
          done

      - name: Archive
        run: zip -r -y "$PACKAGE.zip" "$PACKAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            ${{ env.PACKAGE }}.zip
            ${{ env.PACKAGE }}-*.dylib
          if-no-files-found: error

  wasm:
    needs: [test, version]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PACKAGE: ua-cryptography-${{ needs.version.outputs.version }}-wasm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The npm package ua-cryptography: the ES module for browsers and its Node.js entry.
      - name: Build
        run: build_scripts/npm-package.sh npm

      - name: Smoke test
        run: build_scripts/npm-smoke-test.sh "npm/ua-cryptography-$VERSION.tgz"

      # The release carries the package unpacked as well, for a page that loads it without npm.
      - name: Archive
        run: |
          mv npm/ua-cryptography "$PACKAGE"
          zip -r "$PACKAGE.zip" "$PACKAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: npm/ua-cryptography-${{ env.VERSION }}.tgz
          if-no-files-found: error

  release:
    needs: [version, windows, macos, linux, android, ios, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ua-cryptography-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum ua-cryptography-* > SHA256SUMS
          cat SHA256SUMS

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes $prerelease
          fi

  # Publishing is the author's decision: the job waits for an approval of the `npm` environment (Settings →
  # Environments → npm → Required reviewers). npm trusts this workflow by OIDC (the package's Trusted Publisher
  # settings), so no token is stored, and the package carries a provenance statement.
  npm:
    needs: [version, release]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for a publish credential
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish
        run: |
          # Trusted publishing needs npm 11.5.1 or later.
          npm install --global npm@11
          tag="latest"
          if [[ "$VERSION" == *-* ]]; then tag="next"; fi
          npm publish "ua-cryptography-$VERSION.tgz" --access public --tag "$tag"

  # Publishing is the author's decision: the job waits for an approval of the `crates-io` environment (Settings →
  # Environments → crates-io → Required reviewers). crates.io trusts this workflow by OIDC (each crate's Trusted
  # Publishing settings), so no token is stored; the one the job obtains lives 30 minutes.
  crates-io:
    needs: [release]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # the OIDC token crates.io exchanges for a publish token
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # In dependency order, each crate waiting for the previous one to reach the index; the crates with
      # publish = false (ffi, operations, wasm) are skipped.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked
